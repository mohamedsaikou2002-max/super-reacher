name: HyperReacher launch validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-lockfile:
    name: Repair npm lockfile on internal review branch
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refresh stale npm lockfile without install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install and normalize formatting on internal review branch
        run: |
          npm ci --no-audit --no-fund
          npx prettier --write .
          npx eslint . --fix
      - name: Commit generated lockfile and normalized code when necessary
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          # GitHub Actions token cannot push modifications to workflow YAML.
          git restore -- .github/workflows
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style: synchronize lockfile and normalize formatting"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi

  validation:
    name: ${{ matrix.check }}
    needs: [refresh-lockfile]
    if: always() && (needs.refresh-lockfile.result == 'success' || needs.refresh-lockfile.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [typecheck, lint, test, build]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from synchronized lockfile
        run: npm ci --no-audit --no-fund
      - name: Check ${{ matrix.check }}
        run: npm run ${{ matrix.check }}
